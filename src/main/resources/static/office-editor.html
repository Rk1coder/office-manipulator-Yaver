<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Belgeyi düzenle · Yaver</title>
  <script>try{document.documentElement.setAttribute('data-yv',localStorage.getItem('yv_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
  <link rel="stylesheet" href="/office.css">
  <script defer src="/office-core.js"></script><script defer src="/office-chat-panel.js"></script><script defer src="/office-editor.js"></script>
</head>
<body class="editor-page">
  <header class="editor-header">
    <span class="brand">Yaver <span>/ Belge düzenleyici</span></span>
    <div class="actions">
      <button id="close" class="secondary">Önizlemeye dön</button>
      <a id="download" class="button secondary" hidden>Kaydedilen sürümü indir</a>
      <button id="refresh" class="secondary" disabled>Durumu kontrol et</button>
      <button id="toggle-versions" class="secondary">Sürümler</button>
      <button id="toggle-assistant" class="secondary">Asistan</button>
      <button id="save" disabled>Yaver’e kaydet</button>
    </div>
  </header>
  <div class="editor-info">
    <p id="status" role="status" aria-live="polite">Düzenleyici hazırlanıyor…</p>
    <p id="revision">Henüz kaydetme onayı yok.</p>
  </div>
  <p class="editor-help">Belgeyi doğrudan düzenleyin. Sağdaki <strong>Yaver</strong> panelinden seçili metin için düzenleme isteyebilirsiniz. Öneriyi inceleyip uyguladıktan sonra <strong>Yaver’e kaydet</strong> düğmesini kullanın.</p>
  <div class="editor-body">
    <main class="editor-frame"><div id="office-editor"></div></main>
    <div id="versions-panel" class="versions-panel" hidden>
      <div class="versions-header">
        <span>Sürümler</span>
        <button id="close-versions" aria-label="Kapat">✕</button>
      </div>
      <ul id="versions-list"></ul>
    </div>
    <aside id="chat-panel"></aside>
  </div>
  <noscript>Belge düzenleyicisi için JavaScript’i etkinleştirin.</noscript>
</body>
</html>
