server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/officemanipulator}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
  paths-to-match: /api/**, /health

app:
  # API service mode: comma-separated keys (>= 24 chars each). Blank = local tool (localhost only, no key).
  api:
    keys: ${YAVER_API_KEYS:}
    # Browser apps on these exact origins may call the API (CORS), e.g. https://portal.example.com
    allowed-origins: ${YAVER_CORS_ORIGINS:}
  web-ui:
    enabled: ${WEB_UI_ENABLED:false}
  sandbox:
    preflight: ${SANDBOX_PREFLIGHT:false}
  agent:
    provider: ${AGENT_PROVIDER:legacy}
    deep-agents:
      base-url: ${DEEP_AGENTS_BASE_URL:http://localhost:8000}
      internal-token: ${DEEP_AGENTS_INTERNAL_TOKEN:}
  office:
    transport:
      enabled: ${OFFICE_TRANSPORT_ENABLED:false}
      address: ${OFFICE_TRANSPORT_ADDRESS:}
      port: ${OFFICE_TRANSPORT_PORT:0}
    enabled: ${OFFICE_ENABLED:false}
    jwt-secret: ${OFFICE_JWT_SECRET:}
    public-url: ${OFFICE_PUBLIC_URL:http://localhost:8082}
    internal-url: ${OFFICE_INTERNAL_URL:http://office-docs}
    app-public-url: ${OFFICE_APP_PUBLIC_URL:http://localhost:8090}
    app-internal-url: ${OFFICE_APP_INTERNAL_URL:http://office-app:8080}
  storage:
    base-path: ${STORAGE_BASE_PATH:/tmp/office-manipulator/files}
    file-ttl-hours: ${FILE_TTL_HOURS:72}
  budget:
    limit-usd: ${BUDGET_LIMIT_USD:20.00}
    warn-threshold-usd: 19.50
  # Customer-supplied LLM: provider is one of a fixed whitelist (anthropic|gemini|openai), each
  # with a hard-coded endpoint. User-facing endpoints may override provider/key/model per request
  # (llm_provider/llm_api_key/llm_model); background work always uses these defaults.
  llm:
    provider: ${LLM_PROVIDER:anthropic}
    # Default model's price; blank = built-in table (Anthropic models only). CLAUDE_* kept for old .env files.
    input-price-per-million: ${LLM_INPUT_PRICE_PER_MILLION:${CLAUDE_INPUT_PRICE_PER_MILLION:}}
    output-price-per-million: ${LLM_OUTPUT_PRICE_PER_MILLION:${CLAUDE_OUTPUT_PRICE_PER_MILLION:}}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:${CLAUDE_MODEL:claude-sonnet-4-6}}
      # Operator-run proxy only (env, never request input); blank = official API.
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
  presentation:
    # Render → visual review → rewrite rounds after a deck first validates (needs ONLYOFFICE; 0 = off).
    review-rounds: ${PRESENTATION_REVIEW_ROUNDS:2}
  claude:
    max-tokens: 32000
    max-tool-turns: 4
  limits:
    source-text-bytes: 81920
    max-word-sections: 60
    max-ppt-slides: 80
    max-pdf-blocks: 400
    max-csv-rows: 20000
    max-output-bytes: 104857600
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image-preview}
    enabled: ${GEMINI_ENABLED:false}
    input-price-per-million: ${GEMINI_INPUT_PRICE_PER_MILLION:0}
    output-price-per-million: ${GEMINI_OUTPUT_PRICE_PER_MILLION:0}

logging:
  level:
    com.officemanipulator: INFO
    org.flywaydb: WARN
